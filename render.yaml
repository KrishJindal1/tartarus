# Render Blueprint — JOCKEY backend (FastAPI + SQLite).
# Deploy: Render dashboard → New → Blueprint → pick this repo (renders this file),
#   or New → Web Service → connect repo → Runtime: Docker (uses the settings below).
services:
  - type: web
    name: jockey-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free

    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"

      - key: ENVIRONMENT
        value: production

      - key: AUTH_ENABLED
        value: "false"

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        value: '["https://jockytartarus.vercel.app"]'

      - key: DATABASE_PATH
        value: /tmp/jockey.db
