version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app/backend
      - ./compiler:/app/compiler
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  backend-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: python -m services.result_ingester --worker
    depends_on:
      - backend
    restart: unless-stopped
